# ==============================================================================
# RELAY CORRIDOR — TRAINER CONFIGURATION: LOW EXTRAVERSION (Agent 1)
# Personality Profile: Extraversion E=0.1, Agreeableness A=0.1
# Behavioral Intent: Deliberate, cautious movement, low traversal velocity,
#                    minimal spontaneous exploration, high stationarity.
# ==============================================================================

behaviors:
  RelayAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003

      # ------------------------------------------------------------------------
      # OCEAN PARAMETER 1: BETA (Entropy Regularization)
      # Low-E setting: beta = 0.003 (High-E is 0.01)
      # PSYCHOLOGICAL RATIONALE (OCEAN Extraversion Theory):
      # Introverted (Low-E) agents exhibit low stimulus-seeking behavior and lower
      # behavioral entropy. A small beta coefficient allows the action distribution
      # to concentrate tightly around steady, low-velocity trajectories without
      # continuous erratic exploration, producing visually distinguishable calm
      # and deliberate pacing.
      # ------------------------------------------------------------------------
      beta: 0.003

      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      # ------------------------------------------------------------------------
      # OCEAN PARAMETER 2: CURIOSITY INTRINSIC REWARD (Exploration Drive)
      # Low-E setting: curiosity strength = 0.01 (High-E is 0.05)
      # PSYCHOLOGICAL RATIONALE (OCEAN Extraversion Theory):
      # Introversion manifests in psychological literature as comfort with familiar,
      # predictable states. Minimizing curiosity prevents the policy from being pulled
      # away from assigned areas or lingering points by novelty-seeking impulses.
      # ------------------------------------------------------------------------
      curiosity:
        gamma: 0.99
        strength: 0.01
        network_settings:
          hidden_units: 256
          num_layers: 3
        learning_rate: 0.0003

    keep_checkpoints: 5
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 50000
