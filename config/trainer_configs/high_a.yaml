# ==============================================================================
# RELAY CORRIDOR — TRAINER CONFIGURATION: HIGH AGREEABLENESS (Agent 2)
# Personality Profile: Extraversion E=0.1, Agreeableness A=0.9
# Behavioral Intent: Highly cooperative, patient pad-holding, altruistic support
#                    for teammates carrying the cell, low contact / zero push.
# ==============================================================================

behaviors:
  RelayAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003

      # ------------------------------------------------------------------------
      # OCEAN PARAMETER 1: BETA (Entropy Regularization)
      # High-A setting: beta = 0.003
      # PSYCHOLOGICAL RATIONALE (OCEAN Agreeableness Theory):
      # Agreeable agents are prosocial and reliable. High behavioral stability
      # is essential for holding relay pads consistently while peers pass through
      # gates. A lower beta prevents the agent from wandering off the trigger pad
      # due to exploratory noise, reinforcing steady, patient cooperative duties.
      # ------------------------------------------------------------------------
      beta: 0.003

      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      # ------------------------------------------------------------------------
      # OCEAN PARAMETER 2: CURIOSITY INTRINSIC REWARD (Exploration Drive)
      # High-A setting: curiosity strength = 0.01
      # PSYCHOLOGICAL RATIONALE (OCEAN Agreeableness Theory):
      # Altruistic role specialization in cooperative tasks requires suppressing
      # distracting self-directed exploration. Low curiosity ensures that extrinsic
      # pad-holding rewards and team delivery bonuses dominate the optimization
      # landscape, fostering human-perceivable dedication to the support role.
      # ------------------------------------------------------------------------
      curiosity:
        gamma: 0.99
        strength: 0.01
        network_settings:
          hidden_units: 256
          num_layers: 3
        learning_rate: 0.0003

    keep_checkpoints: 5
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 50000
