# ==============================================================================
# RELAY CORRIDOR — TRAINER CONFIGURATION: LOW AGREEABLENESS (Agent 3)
# Personality Profile: Extraversion E=0.1, Agreeableness A=0.1
# Behavioral Intent: Self-interested, impatient, intolerant of waiting for peers,
#                    prone to pushing past teammates to reach objectives.
# ==============================================================================

behaviors:
  RelayAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003

      # ------------------------------------------------------------------------
      # OCEAN PARAMETER 1: BETA (Entropy Regularization)
      # Low-A setting: beta = 0.003
      # PSYCHOLOGICAL RATIONALE (OCEAN Agreeableness Theory):
      # In the MDPI baseline design, Low-A is paired with Low-E to isolate the
      # Agreeableness axis. Low beta ensures that the agent's competitive, push-tolerant
      # traits are learned as a direct policy response rather than noise.
      # ------------------------------------------------------------------------
      beta: 0.003

      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      # ------------------------------------------------------------------------
      # OCEAN PARAMETER 2: CURIOSITY INTRINSIC REWARD (Exploration Drive)
      # Low-A setting: curiosity strength = 0.01
      # PSYCHOLOGICAL RATIONALE (OCEAN Agreeableness Theory):
      # While agreeable agents are shaped by pad holding, low-agreeableness agents
      # are shaped primarily by low push penalties and selfish cell-delivery priority.
      # Keeping curiosity low focuses training on physical navigation and collision
      # tolerance without exploratory dilution.
      # ------------------------------------------------------------------------
      curiosity:
        gamma: 0.99
        strength: 0.01
        network_settings:
          hidden_units: 256
          num_layers: 3
        learning_rate: 0.0003

    keep_checkpoints: 5
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 50000
