# Quick Proof-of-Concept Training (300k steps) - High Agreeableness (Agent 2)
# Extraversion E=0.1, Agreeableness A=0.9
behaviors:
  RelayAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.003         # Low entropy / high pad-holding stability
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.01    # Low curiosity / team role focus
        network_settings:
          hidden_units: 256
          num_layers: 3
        learning_rate: 0.0003
    keep_checkpoints: 5
    max_steps: 300000
    time_horizon: 128
    summary_freq: 10000